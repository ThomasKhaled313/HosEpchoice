name: hosepchoice
description: A new Flutter project.
publish_to: 'none'

version: 2.0.9+31

environment:
  sdk: ">=2.17.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_storage: ^12.4.5
  firebase_core: ^3.13.0
  firebase_database:
  carousel_slider: ^5.0.0
  audioplayers: ^6.4.0
  share_plus: ^7.2.1
  fluttertoast:
  in_app_update: ^4.2.3
  url_launcher:
  video_player:
  flutter_launcher_icons: ^0.13.1
  cupertino_icons:
  just_audio: ^0.9.39
  audio_service: ^0.18.13
  audio_session: ^0.1.18

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  fonts:
    - family: Coptic
      fonts:
        - asset: fonts/coptic.ttf

  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/splash.png              # your logo file
  adaptive_icon_foreground: assets/splash.png
  adaptive_icon_background: "#00000000"    # fully transparent background